[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "trenddeck"
version = "0.1.0"
description = "OHLCV trend analysis, portfolio dashboard and HTTP MCP service"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.116.1", "uvicorn==0.35.0", "mcp==1.30.0", "sse-starlette==3.0.3",
  "pandas==2.3.3", "numpy==2.2.6", "matplotlib==3.10.8",
  "curl-cffi==0.13.0", "python-dotenv==1.2.3",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "ruff==0.16.7"]

[tool.setuptools]
py-modules = ["app"]
include-package-data = false

[tool.setuptools.packages.find]
include = ["trenddeck*"]
namespaces = false

[tool.setuptools.package-data]
trenddeck = ["web/*", "web/vendor/*", "resources/models/*.json", "resources/templates/*.md"]

[tool.ruff]
target-version = "py311"
line-length = 110
cache-dir = "local/cache/ruff"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
cache_dir = "local/cache/pytest"
