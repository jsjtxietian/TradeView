<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Trend Deck</title>
  <link rel="stylesheet" href="/static/styles.css?v=20260606-01" />
</head>
<body>
  <div class="page-shell">
    <p id="messageBar" class="message-bar" hidden></p>

    <section class="panel">
      <div class="panel-header">
        <div>
          <h2>自选股概览</h2>
        </div>
        <div class="watchlist-tools">
          <form id="addSymbolForm" class="watchlist-add-form">
            <input id="symbolInput" name="symbol" type="text" placeholder="例如 AAPL 或 NVDA" autocomplete="off" />
            <button type="submit">添加</button>
          </form>
          <div class="watchlist-filter">
            <button
              type="button"
              id="watchlistFilterButton"
              class="secondary watchlist-filter-button"
              aria-expanded="false"
              aria-controls="watchlistFilterPanel"
            >
              <span>筛选</span>
              <span id="watchlistFilterCount" class="watchlist-filter-count" hidden></span>
            </button>
            <div id="watchlistFilterPanel" class="watchlist-filter-panel" hidden>
              <div class="watchlist-filter-head">
                <strong>筛选自选股</strong>
                <button type="button" id="clearWatchlistFiltersButton" class="filter-clear-button">清除</button>
              </div>
              <label class="watchlist-filter-option">
                <span>
                  <strong>趋势模板</strong>
                  <small>仅显示通过全部基础趋势检查的股票</small>
                </span>
                <input id="trendFilterInput" type="checkbox" />
                <i aria-hidden="true"></i>
              </label>
              <label class="watchlist-filter-option">
                <span>
                  <strong>我的持仓</strong>
                  <small>仅显示已在笔记中标记为持仓的股票</small>
                </span>
                <input id="holdingFilterInput" type="checkbox" />
                <i aria-hidden="true"></i>
              </label>
            </div>
          </div>
          <button type="button" id="editGroupsButton" class="secondary">分组</button>
          <button type="button" id="refreshButton" class="secondary">拉新</button>
          <button type="button" id="tradeReviewButton" class="secondary">交易复盘</button>
          <button type="button" id="alertsButton" class="secondary alerts-button" aria-label="查看提醒">
            <span class="alerts-bell">i</span>
          </button>
        </div>
      </div>
      <div id="watchlistBoard" class="watchlist-board"></div>
    </section>

    <section id="detailSection" class="detail-grid" hidden>
      <section class="panel chart-panel">
        <div class="panel-header">
          <div>
            <div class="chart-title-row">
              <h3 id="chartTitle">选择一只股票</h3>
              <div id="chartHeadlineStats" class="chart-headline-stats"></div>
              <span id="chartStatusNote" class="chart-status-note" hidden></span>
            </div>
            <div id="chartHoldingStats" class="chart-holding-stats"></div>
          </div>
          <div class="chart-tools">
            <select id="chartMode" class="chart-mode-select" aria-label="切换图表模式">
              <option value="close">收盘价线</option>
              <option value="candles">K线</option>
            </select>
            <label class="compare-toggle">
              <input type="checkbox" id="compareBenchmarkToggle" />
              显示 SPY
            </label>
            <div id="maToggleGroup" class="ma-toggle-group" aria-label="均线显示">
              <span class="ma-toggle-prefix">MA</span>
              <label class="ma-toggle ma20" title="显示或隐藏 MA20">
                <input type="checkbox" data-ma="MA20" checked />
                <span>20</span>
              </label>
              <label class="ma-toggle ma50" title="显示或隐藏 MA50">
                <input type="checkbox" data-ma="MA50" checked />
                <span>50</span>
              </label>
              <label class="ma-toggle ma150" title="显示或隐藏 MA150">
                <input type="checkbox" data-ma="MA150" checked />
                <span>150</span>
              </label>
              <label class="ma-toggle ma200" title="显示或隐藏 MA200">
                <input type="checkbox" data-ma="MA200" checked />
                <span>200</span>
              </label>
            </div>
            <button type="button" id="copyPromptButton" class="secondary chart-copy-button">复制 Prompt</button>
          </div>
        </div>
        <div class="chart-stack">
          <div id="benchmarkChartPanel" class="benchmark-chart-panel" hidden>
            <div id="benchmarkChartLabel" class="benchmark-chart-label">SPY</div>
            <div id="benchmarkChartContainer" class="benchmark-chart-container"></div>
          </div>
          <div class="price-chart-shell">
            <div id="stockChartLabel" class="stock-chart-label" hidden></div>
            <div id="priceChartContainer" class="price-chart-container"></div>
            <div id="chartHoverCard" class="chart-hover-card" hidden></div>
          </div>
          <div id="volumeChartContainer" class="volume-chart-container"></div>
        </div>
      </section>

      <div class="detail-columns">
        <section class="panel">
          <div class="panel-header">
            <div>
              <h3>趋势模板检查</h3>
            </div>
          </div>
          <div id="trendChecks" class="check-list"></div>
        </section>
        <section class="panel">
          <div class="panel-header">
            <div>
              <h3>趋势扩展检查</h3>
            </div>
          </div>
          <div id="advancedTrendChecks" class="check-list"></div>
        </section>
        <section class="panel">
          <div class="panel-header">
            <div>
              <h3>形态 / 风控检查</h3>
            </div>
          </div>
          <div id="patternRiskChecks" class="check-list"></div>
        </section>
      </div>
    </section>
  </div>

  <dialog id="groupEditorDialog" class="group-editor-dialog">
    <form method="dialog" class="group-editor-shell">
      <div class="panel-header">
        <div>
          <p class="panel-kicker">Groups</p>
          <h3>编辑自选股分组</h3>
        </div>
      </div>
      <p class="group-editor-help">每行一组。名称可改，股票代码用逗号分隔，保存后立即更新页面里的分组区块。</p>
      <div id="groupEditorList" class="group-editor-list"></div>
      <div class="group-editor-actions">
        <button type="button" id="addGroupRowButton" class="secondary">新增分组</button>
        <button type="button" id="cancelGroupEditButton" class="secondary">取消</button>
        <button type="button" id="saveGroupEditButton">保存分组</button>
      </div>
    </form>
  </dialog>

  <dialog id="noteDialog" class="group-editor-dialog">
    <form method="dialog" class="group-editor-shell note-dialog-shell">
      <div class="panel-header">
        <div>
          <p class="panel-kicker">Note</p>
          <h3 id="noteDialogTitle">股票笔记</h3>
        </div>
      </div>
      <label class="note-editor-field">
        <span>内容</span>
        <textarea id="noteTextarea" rows="10" placeholder="记录交易计划、关键价位、财报关注点等"></textarea>
      </label>
      <div class="note-metrics-grid">
        <label class="note-editor-field">
          <span>成本价</span>
          <input id="noteCostBasisInput" type="number" min="0" step="0.0001" placeholder="例如 128.50" />
        </label>
        <label class="note-editor-field">
          <span>股数</span>
          <input id="noteSharesInput" type="number" min="0" step="0.0001" placeholder="可不填" />
        </label>
      </div>
      <div class="group-editor-actions note-editor-actions">
        <label class="note-flag-toggle">
          <input id="noteHoldingCheckbox" type="checkbox" />
          <span>标记为我的持仓</span>
        </label>
        <button type="button" id="deleteSymbolButton" class="secondary">删除该股票</button>
        <button type="button" id="cancelNoteButton" class="secondary">取消</button>
        <button type="button" id="saveNoteButton">保存笔记</button>
      </div>
    </form>
  </dialog>

  <dialog id="alertsDialog" class="group-editor-dialog">
    <form method="dialog" class="group-editor-shell alerts-dialog-shell">
      <div class="panel-header">
        <div>
          <h3>最近变化</h3>
        </div>
      </div>
      <div id="alertsList" class="alerts-list"></div>
      <div class="group-editor-actions">
        <button type="button" id="closeAlertsButton" class="secondary">关闭</button>
      </div>
    </form>
  </dialog>

  <dialog id="tradeReviewDialog" class="group-editor-dialog trade-review-dialog">
    <form id="tradeReviewForm" class="group-editor-shell trade-review-shell">
      <div class="panel-header">
        <div>
          <p class="panel-kicker">Trade Review</p>
          <h3 id="tradeReviewTitle">交易复盘</h3>
        </div>
      </div>
      <section class="trade-review-choice existing">
        <div class="trade-review-choice-head">
          <div>
            <span class="trade-review-step">打开已有复盘</span>
            <p>选择后会自动切换到对应股票。</p>
          </div>
        </div>
        <div class="trade-review-choice-row">
          <select id="tradeReviewSelect" aria-label="选择已有复盘"></select>
          <button type="button" id="activateTradeReviewButton">进入复盘</button>
        </div>
      </section>
      <section class="trade-review-choice create">
        <div class="trade-review-choice-head">
          <div>
            <span class="trade-review-step">新建复盘</span>
            <p>先选择股票，再创建一个新的全局复盘编号。</p>
          </div>
        </div>
        <div class="trade-review-choice-row">
          <select id="tradeSymbolSelect" aria-label="选择新建复盘股票"></select>
          <button type="button" id="createTradeReviewButton" class="secondary">新建</button>
        </div>
      </section>
      <div class="trade-review-editor-divider">
        <span>当前复盘交易记录</span>
      </div>
      <div class="trade-entry-grid">
        <label class="note-editor-field">
          <span>日期</span>
          <input id="tradeDateInput" type="date" required />
        </label>
        <fieldset class="trade-side-field">
          <legend>类型</legend>
          <div class="trade-side-options">
            <label class="buy">
              <input type="radio" name="tradeSide" value="buy" checked />
              <span>买入</span>
            </label>
            <label class="sell">
              <input type="radio" name="tradeSide" value="sell" />
              <span>卖出</span>
            </label>
          </div>
        </fieldset>
        <label class="note-editor-field">
          <span>价格</span>
          <input id="tradePriceInput" type="number" min="0.0001" step="0.0001" required />
        </label>
        <label class="note-editor-field">
          <span>数量</span>
          <input id="tradeQuantityInput" type="number" min="0.0001" step="0.0001" placeholder="例如 100" required />
        </label>
      </div>
      <label class="note-editor-field">
        <span>备注</span>
        <textarea id="tradeNoteInput" rows="3" placeholder="例如：突破枢轴试仓、跌破 MA50 减仓"></textarea>
      </label>
      <div class="trade-form-actions">
        <button type="submit">添加记录</button>
      </div>
      <div class="trade-review-section">
        <div class="trade-review-section-head">
          <h4>历史记录</h4>
          <span id="tradeRecordCount"></span>
        </div>
        <div id="tradeRecordList" class="trade-record-list"></div>
      </div>
      <div class="group-editor-actions">
        <button type="button" id="closeTradeReviewButton" class="secondary">关闭</button>
      </div>
    </form>
  </dialog>

  <div id="toast" class="toast" hidden></div>

  <script src="https://unpkg.com/lightweight-charts@5.0.0/dist/lightweight-charts.standalone.production.js"></script>
  <script src="/static/app.js?v=20260606-01" type="module"></script>
</body>
</html>
